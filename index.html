<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Ratings</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0d;
      --surface: #1a1917;
      --surface2: #242220;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text: #f0ede8;
      --text-muted: #888580;
      --text-dim: #555250;
      --accent: #e8b84b;
      --accent-dim: rgba(232,184,75,0.12);
      --accent-border: rgba(232,184,75,0.3);
      --accent-text: #c9962a;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 1.25rem 1rem 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      border-bottom: 0.5px solid var(--border);
    }

    .nav-tab {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 20px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.02em;
    }

    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .page { display: none; padding: 2rem 1rem 4rem; }
    .page.active { display: block; }

    .container { max-width: 680px; margin: 0 auto; }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-top: 0.5rem;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .page-header h1 span { color: var(--accent); }

    .page-header p {
      margin-top: 0.4rem;
      font-size: 14px;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    textarea:focus { border-color: var(--border-hover); }

    input[type="text"]::placeholder,
    textarea::placeholder { color: var(--text-dim); }

    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

    textarea { resize: vertical; min-height: 76px; line-height: 1.5; }

    .char-row { display: flex; justify-content: flex-end; }
    .char-count { font-size: 11px; color: var(--text-dim); transition: color 0.15s; }
    .char-count.warn { color: var(--accent-text); }

    .rating-row { display: flex; align-items: center; gap: 14px; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .rating-num {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      color: var(--accent);
      min-width: 46px;
      text-align: right;
    }

    .stars-preview {
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--accent);
      margin-top: 6px;
    }

    .movie-search-wrap { position: relative; }

    .movie-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface);
      border: 0.5px solid var(--border-hover);
      border-radius: var(--radius-sm);
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      display: none;
    }

    .movie-dropdown.open { display: block; }

    .movie-option {
      padding: 9px 14px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .movie-option:hover, .movie-option.hl { background: var(--surface2); }

    .opt-year { font-size: 12px; color: var(--text-dim); }
    .opt-genre { font-size: 11px; color: var(--text-muted); margin-left: auto; }

    .selected-pill {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--accent-dim);
      border: 0.5px solid var(--accent-border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 14px;
      color: var(--accent);
      margin-top: 6px;
    }

    .selected-pill.on { display: flex; }

    .pill-clear {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--accent-text);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 2px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #0f0e0d;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.98); opacity: 0.85; }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 8px;
    }

    .list-header-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sort-row { display: flex; align-items: center; gap: 8px; }
    .sort-row label { font-size: 12px; color: var(--text-dim); }

    select {
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .count-tag { font-size: 12px; color: var(--text-dim); }

    .ratings-list { display: flex; flex-direction: column; gap: 10px; }

    .rating-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      transition: border-color 0.15s;
    }

    .rating-card:hover { border-color: var(--border-hover); }

    .rc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .rc-title {
      font-family: 'DM Serif Display', serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
    }

    .rc-title-year {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text-dim);
      margin-left: 5px;
    }

    .rc-score {
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .rc-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .rc-stars { font-size: 12px; letter-spacing: 1px; color: var(--accent); }

    .rc-genre {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 99px;
    }

    .rc-comment {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 0.5px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.65;
      font-style: italic;
    }

    /* MOVIES PAGE */
    .movies-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-box:focus { border-color: var(--border-hover); }
    .search-box::placeholder { color: var(--text-dim); }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
    }

    .movie-tile {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.9rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .movie-tile:hover {
      border-color: var(--border-hover);
      background: var(--surface2);
    }

    .tile-genre {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .tile-title {
      font-family: 'DM Serif Display', serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
    }

    .tile-year { font-size: 12px; color: var(--text-dim); }

    .tile-avg {
      margin-top: auto;
      padding-top: 8px;
      font-size: 12px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tile-avg-num { font-weight: 500; }

    .tile-no-ratings {
      margin-top: auto;
      padding-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .rate-btn {
      margin-top: 6px;
      width: 100%;
      padding: 6px;
      background: none;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .rate-btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 0.5px solid var(--border-hover);
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .page-header h1 { font-size: 2rem; }
      .movies-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>

  <nav>
    <button class="nav-tab active" onclick="showPage('rate')">Rate a movie</button>
    <button class="nav-tab" onclick="showPage('movies')">Browse movies</button>
    <button class="nav-tab" onclick="showPage('ratings')">All ratings</button>
  </nav>

  <!-- PAGE: RATE -->
  <div class="page active" id="page-rate">
    <div class="container">
      <div class="page-header">
        <h1>Rate a <span>Movie</span></h1>
        <p>Select a film and share your take.</p>
      </div>

      <div class="card">
        <p class="card-title">Add a rating</p>
        <div class="form-grid">

          <div class="form-group full">
            <label>Movie</label>
            <div class="movie-search-wrap">
              <input type="text" id="movieSearch"
                placeholder="Search for a film…"
                autocomplete="off"
                oninput="onMovieSearch()"
                onkeydown="onMovieKey(event)"
                onfocus="openDd()" />
              <div class="movie-dropdown" id="movieDd"></div>
            </div>
            <div class="selected-pill" id="selPill">
              <span id="pillText"></span>
              <button class="pill-clear" onclick="clearMovie()">✕</button>
            </div>
          </div>

          <div class="form-group">
            <label for="userName">Your name</label>
            <input type="text" id="userName" placeholder="e.g. Alex" />
          </div>

          <div class="form-group">
            <label for="dateWatched">Date watched</label>
            <input type="date" id="dateWatched" />
          </div>

          <div class="form-group full">
            <label>Rating (out of 10)</label>
            <div class="rating-row">
              <input type="range" min="0" max="10" step="0.1" value="7" id="ratingSlider" oninput="updateRating(this.value)" />
              <span class="rating-num" id="ratingDisplay">7.0</span>
            </div>
            <div class="stars-preview" id="starDisplay"></div>
          </div>

          <div class="form-group full">
            <label for="commentInput">Comment <span style="font-weight:400;color:var(--text-dim);">— optional</span></label>
            <textarea id="commentInput" placeholder="What did you think?" maxlength="200" oninput="updateCharCount()"></textarea>
            <div class="char-row">
              <span class="char-count" id="charCount">0 / 200</span>
            </div>
          </div>

        </div>
        <button class="submit-btn" onclick="submitRating()">Save rating</button>
      </div>
    </div>
  </div>

  <!-- PAGE: MOVIES -->
  <div class="page" id="page-movies">
    <div class="container">
      <div class="page-header">
        <h1>Browse <span>Films</span></h1>
        <p>100 popular movies — tap any tile to rate it.</p>
      </div>
      <div class="movies-toolbar">
        <input class="search-box" type="text" id="tileSearch" placeholder="Search movies…" oninput="renderTiles()" />
        <select id="genreFilter" onchange="renderTiles()">
          <option value="">All genres</option>
        </select>
      </div>
      <div class="movies-grid" id="moviesGrid"></div>
    </div>
  </div>

  <!-- PAGE: RATINGS -->
  <div class="page" id="page-ratings">
    <div class="container">
      <div class="page-header">
        <h1>All <span>Ratings</span></h1>
        <p>Every rating submitted so far.</p>
      </div>
      <div class="list-header">
        <span class="list-header-title">Ratings <span class="count-tag" id="countBadge"></span></span>
        <div class="sort-row">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect" onchange="renderRatings()">
            <option value="newest">Newest first</option>
            <option value="highest">Highest rated</option>
            <option value="lowest">Lowest rated</option>
            <option value="title">Title A–Z</option>
          </select>
        </div>
      </div>
      <div class="ratings-list" id="ratingsList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>

    { title: "The Imitation Game", year: 2014, genre: "Drama" },
    { title: "The Lion King", year: 1994, genre: "Animation" },
    { title: "The Lord of the Rings: The Fellowship of the Ring", year: 2001, genre: "Fantasy" },
    { title: "The Lord of the Rings: The Return of the King", year: 2003, genre: "Fantasy" },
    { title: "The Martian", year: 2015, genre: "Sci-Fi" },
    { title: "The Matrix", year: 1999, genre: "Sci-Fi" },
    { title: "The Revenant", year: 2015, genre: "Adventure" },
    { title: "The Shawshank Redemption", year: 1994, genre: "Drama" },
    { title: "The Silence of the Lambs", year: 1991, genre: "Thriller" },
    { title: "The Sixth Sense", year: 1999, genre: "Thriller" },
    { title: "The Social Network", year: 2010, genre: "Drama" },
    { title: "The Truman Show", year: 1998, genre: "Drama" },
    { title: "The Wolf of Wall Street", year: 2013, genre: "Comedy" },
    { title: "There Will Be Blood", year: 2007, genre: "Drama" },
    { title: "Thor: Ragnarok", year: 2017, genre: "Action" },
    { title: "Titanic", year: 1997, genre: "Romance" },
    { title: "Top Gun: Maverick", year: 2022, genre: "Action" },
    { title: "Toy Story", year: 1995, genre: "Animation" },
    { title: "Terminator 2: Judgment Day", year: 1991, genre: "Action" },
    { title: "Up", year: 2009, genre: "Animation" },
    { title: "WALL-E", year: 2008, genre: "Animation" },
    { title: "Whiplash", year: 2014, genre: "Drama" },
    { title: "Zodiac", year: 2007, genre: "Crime" },
  ];

  const KEY = 'movieRatings_v1';
  let selMovie = null;
  let ddItems = [];
  let ddIdx = -1;

  function loadRatings() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }

  function saveRatings(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function starsFor(score) {
    const full = Math.round(score / 2);
    return Array.from({length:5}, (_,i) => i < full ? '★' : '☆').join('');
  }

  /* NAV */
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    ['rate','movies','ratings'].forEach((n,i) => {
      if (n === name) document.querySelectorAll('.nav-tab')[i].classList.add('active');
    });
    closeDd();
    if (name === 'ratings') renderRatings();
    if (name === 'movies')  renderTiles();
  }

  /* RATING FORM */
  function updateRating(v) {
    const val = parseFloat(v).toFixed(1);
    document.getElementById('ratingDisplay').textContent = val;
    document.getElementById('starDisplay').textContent = starsFor(parseFloat(val));
  }

  function updateCharCount() {
    const len = document.getElementById('commentInput').value.length;
    const el = document.getElementById('charCount');
    el.textContent = len + ' / 200';
    el.className = 'char-count' + (len >= 180 ? ' warn' : '');
  }

  /* DROPDOWN */
  function onMovieSearch() {
    selMovie = null;
    document.getElementById('selPill').classList.remove('on');
    const q = document.getElementById('movieSearch').value.toLowerCase().trim();
    if (!q) { closeDd(); return; }
    ddItems = MOVIES.filter(m =>
      m.title.toLowerCase().includes(q) || String(m.year).includes(q)
    ).slice(0, 14);
    renderDd();
  }

  function renderDd() {
    const dd = document.getElementById('movieDd');
    if (!ddItems.length) { dd.classList.remove('open'); return; }
    dd.innerHTML = ddItems.map((m, i) =>
      `<div class="movie-option" data-i="${i}" onmousedown="pickMovie(${i})">
        <span>${esc(m.title)}</span>
        <span class="opt-year">${m.year}</span>
        <span class="opt-genre">${m.genre}</span>
      </div>`
    ).join('');
    ddIdx = -1;
    dd.classList.add('open');
  }

  function openDd() {
    const q = document.getElementById('movieSearch').value.toLowerCase().trim();
    if (q && !selMovie) renderDd();
  }

  function closeDd() {
    document.getElementById('movieDd').classList.remove('open');
    ddIdx = -1;
  }

  function onMovieKey(e) {
    const dd = document.getElementById('movieDd');
    if (!dd.classList.contains('open')) return;
    const items = dd.querySelectorAll('.movie-option');
    if (e.key === 'ArrowDown') { e.preventDefault(); ddIdx = Math.min(ddIdx+1, items.length-1); hlDd(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ddIdx = Math.max(ddIdx-1, 0); hlDd(items); }
    else if (e.key === 'Enter' && ddIdx >= 0) { e.preventDefault(); pickMovie(ddIdx); }
    else if (e.key === 'Escape') closeDd();
  }

  function hlDd(items) {
    items.forEach((el, i) => el.classList.toggle('hl', i === ddIdx));
  }

  function pickMovie(i) {
    const m = ddItems[i];
    if (!m) return;
    selMovie = m;
    document.getElementById('movieSearch').value = '';
    document.getElementById('pillText').textContent = m.title + ' (' + m.year + ')';
    document.getElementById('selPill').classList.add('on');
    closeDd();
  }

  function clearMovie() {
    selMovie = null;
    document.getElementById('movieSearch').value = '';
    document.getElementById('selPill').classList.remove('on');
  }

  function rateMovie(idx) {
    selMovie = MOVIES[idx];
    document.getElementById('pillText').textContent = selMovie.title + ' (' + selMovie.year + ')';
    document.getElementById('selPill').classList.add('on');
    document.getElementById('movieSearch').value = '';
    showPage('rate');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* SUBMIT */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function submitRating() {
    if (!selMovie)    { showToast('Please select a movie'); return; }
    const user    = document.getElementById('userName').value.trim();
    const date    = document.getElementById('dateWatched').value;
    const rating  = parseFloat(document.getElementById('ratingSlider').value);
    const comment = document.getElementById('commentInput').value.trim();
    if (!user) { showToast('Please enter your name'); return; }
    if (!date) { showToast('Please select a date'); return; }
    const list = loadRatings();
    list.push({ id: Date.now(), title: selMovie.title, year: selMovie.year, genre: selMovie.genre, user, date, rating, comment });
    saveRatings(list);
    clearMovie();
    document.getElementById('userName').value = '';
    document.getElementById('dateWatched').value = '';
    document.getElementById('commentInput').value = '';
    document.getElementById('ratingSlider').value = 7;
    updateRating(7);
    updateCharCount();
    showToast('Rating saved!');
  }

  /* RATINGS PAGE */
  function renderRatings() {
    const list = loadRatings();
    const sort = document.getElementById('sortSelect').value;
    const sorted = [...list].sort((a,b) => {
      if (sort==='newest')  return b.id - a.id;
      if (sort==='highest') return b.rating - a.rating;
      if (sort==='lowest')  return a.rating - b.rating;
      if (sort==='title')   return a.title.localeCompare(b.title);
      return 0;
    });
    document.getElementById('countBadge').textContent =
      list.length === 0 ? '' : list.length === 1 ? '· 1 entry' : `· ${list.length} entries`;
    const el = document.getElementById('ratingsList');
    if (!sorted.length) { el.innerHTML = '<div class="empty">No ratings yet — add the first one.</div>'; return; }
    el.innerHTML = sorted.map(r => {
      const d = new Date(r.date + 'T00:00:00');
      const dateStr = d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
      const commentHtml = r.comment ? `<div class="rc-comment">"${esc(r.comment)}"</div>` : '';
      const genreHtml   = r.genre   ? `<span class="rc-genre">${esc(r.genre)}</span>` : '';
      return `<div class="rating-card">
        <div class="rc-top">
          <span class="rc-title">${esc(r.title)}<span class="rc-title-year">${r.year||''}</span></span>
          <span class="rc-score">${r.rating.toFixed(1)} / 10</span>
        </div>
        <div class="rc-meta">
          <span class="rc-stars">${starsFor(r.rating)}</span>
          ${genreHtml}
          <span>by ${esc(r.user)}</span>
          <span>${dateStr}</span>
        </div>
        ${commentHtml}
      </div>`;
    }).join('');
  }

  /* MOVIES PAGE */
  function buildGenreFilter() {
    const genres = [...new Set(MOVIES.map(m => m.genre))].sort();
    const sel = document.getElementById('genreFilter');
    genres.forEach(g => {
      const o = document.createElement('option');
      o.value = g; o.textContent = g;
      sel.appendChild(o);
    });
  }

  function renderTiles() {
    const q     = (document.getElementById('tileSearch').value || '').toLowerCase();
    const genre = document.getElementById('genreFilter').value;
    const ratings = loadRatings();
    const avgMap = {}, cntMap = {};
    ratings.forEach(r => {
      avgMap[r.title] = (avgMap[r.title] || 0) + r.rating;
      cntMap[r.title] = (cntMap[r.title] || 0) + 1;
    });
    const filtered = MOVIES.filter(m =>
      (!q || m.title.toLowerCase().includes(q) || String(m.year).includes(q)) &&
      (!genre || m.genre === genre)
    );
    const grid = document.getElementById('moviesGrid');
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No movies match.</div>';
      return;
    }
    grid.innerHTML = filtered.map(m => {
      const idx = MOVIES.indexOf(m);
      const cnt = cntMap[m.title] || 0;
      const avg = cnt ? avgMap[m.title] / cnt : null;
      const avgHtml = avg !== null
        ? `<div class="tile-avg">★ <span class="tile-avg-num">${avg.toFixed(1)}</span> <span style="font-size:10px;color:var(--text-dim);">(${cnt})</span></div>`
        : `<div class="tile-no-ratings">No ratings yet</div>`;
      return `<div class="movie-tile" onclick="rateMovie(${idx})">
        <div class="tile-genre">${esc(m.genre)}</div>
        <div class="tile-title">${esc(m.title)}</div>
        <div class="tile-year">${m.year}</div>
        ${avgHtml}
        <button class="rate-btn">Rate this ↗</button>
      </div>`;
    }).join('');
  }

  /* INIT */
  document.addEventListener('click', e => {
    if (!e.target.closest('.movie-search-wrap')) closeDd();
  });

  buildGenreFilter();
  updateRating(7);
  </script>
</body>
</html>
